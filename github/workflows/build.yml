
name: Build Magnet Radar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MagnetRadar-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip MagnetRadar-source.zip

      - name: Build APK
        run: |
          cd MagnetRadar
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MagnetRadar-APK
          path: MagnetRadar/app/build/outputs/apk/debug/*.apk
